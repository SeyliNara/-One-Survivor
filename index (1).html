 {const bg=tileFor(G.wi);if(!bg.pat)bg.pat=c.createPattern(bg.cv,'repeat');c.save();c.translate(-(((ox%128)+128)%128),-(((oy%128)+128)%128));c.fillStyle=bg.pat;c.fillRect(0,0,W+128,H+128);c.restore();props(c,ox,oy)}
 c.textAlign='center';c.textBaseline='middle';c.font='18px serif';
 c.fillStyle='#4fc3f7';for(const g of G.gems){c.beginPath();c.arc(g.x-ox,g.y-oy,4,0,6.283);c.fill()}
 for(const h of G.meat)c.fillText('🍖',h.x-ox,h.y-oy);
 let lf=0;for(const e of G.en){const x=e.x-ox,y=e.y-oy;if(x<-60||x>W+60||y<-60||y>H+60)continue;const s=Math.round(e.r*1.9);if(s!==lf){c.font=s+'px serif';lf=s}dspr(e.s,x,y-Math.abs(Math.sin(G.t*8+e.ph))*3,Math.round(e.r*3.3*Math.min(1,.4+e.ag*2.4)),e.x>p.x,e.f>0,Math.floor(G.t*6+e.ph)%2);if(e.tm.dash>0&&e.tm.dash<.6){c.fillStyle='#ff1744';c.font="12px 'Press Start 2P',monospace";c.fillText('!',x,y-e.r*2.3)}if(e.boss){c.fillStyle='#000';c.fillRect(x-24,y-e.r-10,48,5);c.fillStyle='#e53935';c.fillRect(x-24,y-e.r-10,48*Math.max(0,e.hp/e.mhp),5)}}
 const px=W/2,py=H/2;
 if(p.w.haki){c.strokeStyle='rgba(255,60,60,.35)';c.lineWidth=3;c.beginPath();c.arc(px,py,55+11*p.w.haki,0,6.283);c.stroke()}
 if(p.w.lames){const n=2+p.w.lames,r=68+7*p.w.lames;c.fillStyle='#ffb300';for(let i=0;i<n;i++){const a=p.ang+i*6.283/n;c.beginPath();c.arc(px+Math.cos(a)*r,py+Math.sin(a)*r,9,0,6.283);c.fill()}}
 c.fillStyle='#ffd54f';for(const b of G.pr){if(b.sh){c.strokeStyle='rgba(255,140,0,.8)';c.lineWidth=2;c.beginPath();c.arc(b.x-ox,b.y-oy,b.r,0,6.283);c.stroke()}else{c.beginPath();c.arc(b.x-ox,b.y-oy,4,0,6.283);c.fill()}}
 c.fillStyle='#ff1744';for(const b of G.eb){c.beginPath();c.arc(b.x-ox,b.y-oy,b.r||6,0,6.283);c.fill()}
 c.fillStyle='#ffd54f';for(const q of G.pt)c.fillRect(q.x-ox,q.y-oy,4,4);
 dspr(S_(CH[p.id].sp),px,py-(p.mv?Math.abs(Math.sin(G.t*10))*3:0),52,p.fx<0,p.hf>0,p.mv?Math.floor(G.t*8)%2:0);
 for(const f of G.fx){const a=Math.max(0,f.l/f.m);c.globalAlpha=a;if(f.t==='arc'){c.strokeStyle='#fff';c.lineWidth=6;c.beginPath();c.arc(px,py,f.r,f.a-f.w,f.a+f.w);c.stroke()}else if(f.t==='num'){c.globalAlpha=a;c.fillStyle=f.c?'#ffeb3b':'#fff';c.font="9px 'Press Start 2P',monospace";c.fillText(f.v,f.x-ox,f.y-oy-(1-a)*26)}else if(f.t==='fist'){const u=1-f.l/f.m,rc=f.len*(u<.5?u*2:(1-u)*2),ex=px+Math.cos(f.a)*rc,ey=py+Math.sin(f.a)*rc;c.globalAlpha=1;c.strokeStyle='#f1c9a0';c.lineWidth=7;c.beginPath();c.moveTo(px,py);c.lineTo(ex,ey);c.stroke();c.fillStyle='#e53935';c.fillRect(ex-8,ey-8,16,16)}else if(f.t==='ring'){c.strokeStyle='#ff5252';c.lineWidth=4;c.beginPath();c.arc(px,py,f.r,0,6.283);c.stroke()}else if(f.t==='bolt'){c.strokeStyle='#fff176';c.lineWidth=4;c.beginPath();c.moveTo(f.x-ox,0);c.lineTo(f.x-ox+8,(f.y-oy)/2);c.lineTo(f.x-ox-6,(f.y-oy)/2+6);c.lineTo(f.x-ox,f.y-oy);c.stroke()}else if(f.t==='boom'){c.fillStyle='#ff9800';c.beginPath();c.arc(f.x-ox,f.y-oy,f.r*(1-a*.3),0,6.283);c.fill()}else if(f.t==='warn'){c.fillStyle='rgba(255,40,40,.18)';c.strokeStyle='#f44';c.lineWidth=3;c.beginPath();c.arc(f.x-ox,f.y-oy,f.r,0,6.283);c.fill();c.stroke()}else if(f.t==='msg'){c.globalAlpha=1;c.fillStyle='#ffeb3b';c.font="12px 'Press Start 2P',monospace";c.fillText(f.s,W/2,H*.3)}c.globalAlpha=1}
 const hp=p.hp/p.mhp;if(hp<.3){c.fillStyle='rgba(255,0,0,'+(.2*(1-hp/.3))+')';c.fillRect(0,0,W,H)}c.fillStyle='rgba(0,0,0,.5)';c.fillRect(10,10,W-20,12);c.fillStyle='#e53935';c.fillRect(10,10,(W-20)*Math.max(0,hp),12);c.fillStyle='rgba(0,0,0,.5)';c.fillRect(10,25,W-20,8);c.fillStyle='#29b6f6';c.fillRect(10,25,(W-20)*Math.min(1,p.xp/p.need),8);
 c.fillStyle='#fff';c.font="10px 'Press Start 2P',monospace";c.textAlign='left';c.fillText(G.w.n+' · Niv. '+p.lv+' · ⏱ '+fmtT(G.t)+' · ☠ '+G.kills,10,48);c.font='16px serif';c.fillText('Armes '+Object.keys(p.w).length+'/5 : '+Object.keys(p.w).map(k=>WP[k].ic+p.w[k]).join(' ')+'  '+Object.keys(p.ps).map(k=>PS[k].ic+p.ps[k]).join(' '),10,70);c.textAlign='center';
 const bo=G.en.find(e=>e.boss);if(bo){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(W*.1,84,W*.8,12);c.fillStyle='#ab47bc';c.fillRect(W*.1,84,W*.8*Math.max(0,bo.hp/bo.mhp),12);c.fillStyle='#fff';c.font="8px 'Press Start 2P',monospace";c.fillText(bo.n,W/2,108)}
 if(joy){c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=3;c.beginPath();c.arc(joy.x0,joy.y0,50,0,6.283);c.stroke();c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(joy.x0+joy.dx*50,joy.y0+joy.dy*50,20,0,6.283);c.fill()}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});addEventListener('resize',()=>{if(cv&&G)rs()});
